<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="manifest" href="../site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#ef549e">
    <meta name="msapplication-TileColor" content="#ef549e">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="../index.css">
    <script src="../index.js"></script>
    <title>Schedule | LINEA RECTA</title>
    <script type="module" src="../components/layout.js"></script>
</head>
<body>
<site-layout>
    <div class="content-container">
        <h1>Schedule</h1>
        <hr>
        <h2>Add the schedule to your own agenda</h2>
        <div class="hyperbutton">
            <a href="https://calendar.google.com/calendar/u/2?cid=bGluZWFyZWN0YS5iZXN0dXVyQGdtYWlsLmNvbQ"
               style="margin: 1em;">Click here to subscribe!</a>
        </div>
        <ul id="events-upcoming">
        </ul>
        <!-- <ul id="events-past">
        </ul> -->
        <script src="../assets/google-calendar.js"></script>
        <script>
            function DateString(dag) {
                var datum = new Date();
                if (dag == 'vandaag') {
                    return datum.getUTCFullYear() + '-' +
                        (datum.getUTCMonth() + 1) + '-' +
                        datum.getUTCDate() + 'T' +
                        datum.getUTCHours() + ':' +
                        datum.getUTCMinutes() + ':' +
                        datum.getUTCSeconds() + 'Z'
                } else if (dag == 'toekomst') {
                    datum.setMonth((datum.getMonth() + 2));
                    return datum.getUTCFullYear() + '-' +
                        (datum.getUTCMonth() + 1) + '-' +
                        datum.getUTCDate() + 'T' +
                        datum.getUTCHours() + ':' +
                        datum.getUTCMinutes() + ':' +
                        datum.getUTCSeconds() + 'Z'

                }
            }

            formatGoogleCalendar.init({
                calendarUrl: 'https://www.googleapis.com/calendar/v3/calendars/linearecta.bestuur@gmail.com/events?key=AIzaSyATQd6MGOSyFnQJeCphusRZLCGEl8jT6qU',
                past: false,
                upcoming: true,
                sameDayTimes: true,
                pastTopN: 20,
                upcomingTopN: 20,
                recurringEvents: true,
                itemsTagName: 'li',
                upcomingSelector: '#events-upcoming',
                pastSelector: '#events-past',
                upcomingHeading: '<h2>Upcoming events</h2>',
                pastHeading: '<h2>Past events</h2>',
                format: ['*icon*', '<div>', '*date*', '*hr*', '*summary*', '*location*', '<br>', '*description*', '</div>'],
                timeMin: DateString('vandaag'),
                timeMax: DateString('toekomst')
            });
        </script>
    </div>
</site-layout>
</body>
</html>
